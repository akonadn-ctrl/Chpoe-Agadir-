<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الساعات - أكادير</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111;
  color: white;
  text-align: center;
  padding: 30px 15px;
}

header h1 {
  margin: 0 0 10px;
  font-size: 32px;
}

header p {
  margin: 0;
  font-size: 18px;
}

.container {
  max-width: 900px;
  margin: 25px auto;
  padding: 15px;
}

.product {
  background: white;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.images {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 12px;
}

.images img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
  border-radius: 15px;
  background: #eee;
}

.info {
  padding: 25px;
  text-align: center;
}

.info h2 {
  font-size: 28px;
  margin: 5px 0 15px;
}

.price {
  font-size: 36px;
  font-weight: bold;
  color: #b8860b;
  margin: 15px 0;
}

.details {
  font-size: 20px;
  line-height: 2;
}

.order {
  display: block;
  max-width: 420px;
  margin: 20px auto 10px;
  padding: 16px;
  background: #25D366;
  color: white;
  text-decoration: none;
  border-radius: 15px;
  font-size: 20px;
  font-weight: bold;
}

.phone {
  font-size: 18px;
  margin-top: 10px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #777;
}

@media (max-width: 600px) {
  .images {
    grid-template-columns: 1fr;
  }

  .images img {
    width: 100%;
    height: auto;
  }
}
</style>
</head>

<body>

<header>
  <h1>⌚ الساعات</h1>
  <p>ساعات أنيقة بأسعار مناسبة</p>
</header>

<div class="container">

  <div class="product">

    <div class="images">

      <img src="watch1.jpg" alt="ساعة">

      <img src="watch2.jpg" alt="ساعات">

    </div>

    <div class="info">

      <h2>ساعة أنيقة</h2>

      <div class="price">
        150 درهم
      </div>

      <div class="details">
        📍 المكان: أكادير<br>
        🚚 التوصيل: 10 دراهم<br>
        📦 الدفع عند الاستلام
      </div>

      <a
        class="order"
        href="https://wa.me/212783084921?text=السلام%20عليكم،%20أريد%20طلب%20الساعة%20بثمن%20150%20درهم">
        📱 اطلب الآن عبر واتساب
      </a>

      <div class="phone">
        📞 0783084921
      </div>

    </div>

  </div>

</div>

<footer>
  © 2026 - الساعات | أكادير
</footer>

</body>
  </html>
